<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
      padding: 12px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      color: #4f46e5;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    label { color: #555; }
    select, input {
      width: 130px;
      padding: 4px 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }
    .btn:hover { background: #4338ca; }
    .btn.secondary {
      background: #f3f4f6;
      color: #333;
    }
    .btn.secondary:hover { background: #e5e7eb; }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      min-height: 16px;
    }
    .link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>TransVault 双语翻译</h1>

  <div class="row">
    <label>目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
    </select>
  </div>

  <div class="row">
    <label>显示模式</label>
    <select id="displayMode">
      <option value="bilingual">双语对照</option>
      <option value="translation">仅译文</option>
      <option value="original">仅原文</option>
    </select>
  </div>

  <button class="btn" id="toggleBtn">翻译当前页面</button>
  <button class="btn secondary" id="restoreBtn">还原原文</button>

  <div class="status" id="status"></div>

  <a class="link" href="#" id="openOptions">⚙ 引擎与高级设置</a>

  <script src="../shared/config.js"></script>
  <script src="../shared/util.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
